name: skyscraper
description: "bluesky client."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bluesky: ^1.2.6
  atproto: ^1.2.4
  atproto_core: ^1.0.7
  intl: ^0.20.2
  google_fonts: ^5.0.0
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_linkify: ^6.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1
  workmanager: ^0.9.0+3
  path_provider: ^2.0.15
  image: ^4.0.17
  video_player: ^2.10.1
  chewie: ^1.13.0
  photo_view: ^0.15.0
  shared_preferences: ^2.1.0
  bluesky_text: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
