name: skyscraper
description: "bluesky client."
publish_to: 'none'
version: 1.0.4

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bluesky: ^1.3.0
  atproto: ^1.2.4
  atproto_core: ^1.0.7
  intl: ^0.20.2
  google_fonts: ^5.0.0
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_linkify: ^6.0.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  image_picker: ^1.1.2
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1
  workmanager: ^0.9.0+3
  path_provider: ^2.0.15
  image: ^4.0.17
  video_player: ^2.10.1
  chewie: ^1.13.0
  photo_view: ^0.15.0
  shared_preferences: ^2.1.0
  bluesky_text: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icon/icon-ios.png"
  android_adaptive_icon:
    foreground_image: "assets/launcher_icon/icon-foreground.png"
    background_image: "assets/launcher_icon/icon-background.png"

dependency_overrides:
  meta: 1.16.0
